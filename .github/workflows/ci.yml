name: CI

on:
  pull_request:
  push:
    branches: [main]

# PR は後続の push で古い実行を畳む。main への push は畳まない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 同梱するものと同じ nvim でテストする（release.yml と揃えること）。
  NVIM_VERSION: v0.12.4

jobs:
  lint:
    name: fmt + clippy (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # anvi は Windows 専用なので Linux では core だけ見る（→ windows ジョブ）。
      - run: cargo clippy -p anvi-core --all-targets --locked -- -D warnings

  test-core:
    name: test (core, linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # テストは本物の nvim を起動する。無ければスキップせず失敗する仕様なので必須。
      - uses: rhysd/action-setup-vim@v1
        id: nvim
        with:
          neovim: true
          version: ${{ env.NVIM_VERSION }}
      - run: cargo test -p anvi-core --locked
        env:
          ANVI_TEST_NVIM: ${{ steps.nvim.outputs.executable }}

  windows:
    name: clippy + test (workspace, windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: rhysd/action-setup-vim@v1
        id: nvim
        with:
          neovim: true
          version: ${{ env.NVIM_VERSION }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          ANVI_TEST_NVIM: ${{ steps.nvim.outputs.executable }}
